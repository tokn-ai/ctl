name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  dev-launcher:
    name: Development launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test development and release scripts
        run: node scripts/ci/check.mts scripts

  rust-quality:
    name: Rust quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting and Clippy
        run: node scripts/ci/check.mts quality

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: node scripts/ci/check.mts rust

      - name: Install Bun for caller credential interoperability
        uses: oven-sh/setup-bun@v2

      - name: Test Bun caller credential handoff
        run: cargo test --locked -p ctl-cli --test caller_credentials -- --include-ignored

      - name: Test fresh caller credentials against OpenSSH
        if: runner.os != 'Windows'
        run: bash scripts/ci/caller-ssh-unix.sh

  cargo-packages:
    name: Cargo packages (Rust 1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Package and test published sources
        run: node scripts/ci/check.mts packages

  windows-check:
    name: Windows executable and SSH smoke tests
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun for caller credential interoperability
        uses: oven-sh/setup-bun@v2

      - name: Build Windows executables
        run: cargo build --locked -p ctl-cli -p ctl-agent -p ctld -p ctl-taskd -p ctmux-cli -p ctmuxd -p ctmux-tui

      - name: Exercise Windows ctld status, replacement and stop
        run: ./scripts/ci/windows-ctld.ps1

      - name: Exercise ctl task auto-start and commands
        run: ./scripts/ci/windows-tasks.ps1

      - name: Exercise Windows ctmux auto-start and local ctl routing
        run: ./scripts/ci/windows-ctmux.ps1

      - name: Test authenticated Windows SSH gateway and reconnect
        run: ./scripts/ci/windows-ssh.ps1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check frontend
        run: node scripts/ci/check.mts frontend

      - name: Check workspace command entry points
        run: |
          pnpm desktop:dev --help
          pnpm desktop:preview --help
          pnpm desktop:build --help
          pnpm ctld:build --help
          pnpm ctld:provision --help
          pnpm bundles:sync --help
