[workspace]
members = [
  "process-info",
  "ctl/cli",
  "ctl/core",
  "ctl/agent",
  "rmux/client",
  "rmux/cli",
  "rmux/core",
  "rmux/daemon",
  "apps/rmux/src-tauri",
  "rmux/ipc",
  "rmux/proto",
  "task/proto",
  "task/ipc",
  "task/daemon",
  "task/cli",
  "task/client",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
avt = "0.18.0"
base64 = "0.22.1"
ctl-core = { path = "ctl/core" }
dirs = "6.0.0"
glob = "0.3.4"
nix = { version = "0.29.0", default-features = false, features = ["fs"] }
portable-pty = "0.9.0"
process-info = { path = "process-info" }
rmux-core = { path = "rmux/core" }
rmuxd = { path = "rmux/daemon" }
rmux-client = { path = "rmux/client" }
rmux-cli = { package = "rmux", path = "rmux/cli" }
rmux-ipc = { path = "rmux/ipc" }
rmux-proto = { path = "rmux/proto" }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
task-ipc = { path = "task/ipc" }
task-proto = { path = "task/proto" }
task-cli = { path = "task/cli" }
task-client = { path = "task/client" }
tokio = { version = "1.53.1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
uuid = { version = "1.26.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
