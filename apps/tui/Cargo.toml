[package]
name = "rmux-tui"
version.workspace = true
edition.workspace = true

[dependencies]
avt.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
rmux-client.workspace = true
rmux-ipc.workspace = true
rmux-proto.workspace = true
tokio.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
# The default mio reader in 0.29 loops on terminal EOF/fatal read errors.
# This backend propagates read errors and honors finite polling deadlines.
crossterm = { workspace = true, features = ["use-dev-tty"] }

[dev-dependencies]
portable-pty.workspace = true
rmuxd.workspace = true
uuid.workspace = true

[lints]
workspace = true
