[package]
name = "rmux-app"
version.workspace = true
edition.workspace = true
description = "Graphical client for local and SSH-connected rmux terminal sessions"
publish = false

[lib]
name = "rmux_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
task-client.workspace = true
task-proto.workspace = true
task-store.workspace = true
base64.workspace = true
ctl-core.workspace = true
dirs.workspace = true
glob.workspace = true
rmux-client.workspace = true
rmux-ipc.workspace = true
rmux-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent"] }

[lints]
workspace = true
