[package]
name = "ctl-component-info"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Build identity and executable metadata shared by ctl and ctmux components"
readme = "README.md"
categories = ["development-tools"]
keywords = ["ctl", "ctmux", "metadata"]
publish = ["crates-io"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
executable = ["dep:serde_json", "dep:sha2", "dep:tokio"]

[build-dependencies]
sha2.workspace = true
serde_json.workspace = true

[dev-dependencies]
sha2.workspace = true
serde_json.workspace = true

[lints]
workspace = true
