[package]
name = "ctl-cli"
default-run = "ctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for local and remote terminal sessions, tasks, SSH, and VPN connections"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["ctl", "ssh", "terminal", "tasks", "vpn"]
publish = ["crates-io"]

[[bin]]
name = "ctl"
path = "src/main.rs"

[dependencies]
time.workspace = true
ctl-core = { workspace = true, features = ["observability", "presence"] }
clap.workspace = true
cliclack = "0.5.7"
ctl-client = { workspace = true, features = ["cli"] }
ctl-proto.workspace = true
ctl-ipc.workspace = true
dirs.workspace = true
serde.workspace = true
uuid.workspace = true
ctmux-cli.workspace = true
ctmux-ipc.workspace = true
ctmux-proto.workspace = true
ctl-task-ipc.workspace = true
ctl-task-proto.workspace = true
ctl-task-cli.workspace = true
ctl-task-client.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
url = "2.5.9"
zeroize.workspace = true

[build-dependencies]
ctl-core = { workspace = true, features = ["ctld-bundle-build"] }

[dev-dependencies]
rusqlite.workspace = true
ctl-core = { workspace = true, features = ["test-fixtures"] }
portable-pty.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
nix = { workspace = true, features = ["signal"] }

[target.'cfg(unix)'.dev-dependencies]
avt.workspace = true
ctmux-client.workspace = true
ctmuxd.workspace = true
filedescriptor = "0.8.3"
nix = { workspace = true, features = ["signal"] }
rustix = { workspace = true, features = ["termios"] }

[lints]
workspace = true
