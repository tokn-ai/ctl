[package]
name = "ctl-taskd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Daemon for persistent ctl background tasks"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["ctl", "tasks", "daemon"]
publish = ["crates-io"]

[dependencies]
ctl-core.workspace = true
ctmux-ipc.workspace = true
ctmux-proto.workspace = true
clap.workspace = true
dirs.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
ctl-task-ipc.workspace = true
ctl-task-proto.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
interprocess = { version = "2.4.4", features = ["tokio"] }

[dev-dependencies]
ctmuxd.workspace = true
ctl-task-proto.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
