services:
  ctmux-remote:
    build:
      context: .
      dockerfile: docker/ctmux/Dockerfile
    ports:
      - "127.0.0.1:${CTMUX_SSH_PORT:-2222}:22"
    volumes:
      - type: bind
        source: ${CTMUX_AUTHORIZED_KEYS_FILE:?set CTMUX_AUTHORIZED_KEYS_FILE to an authorized public-key file}
        target: /run/secrets/ctmux_authorized_keys
        read_only: true
      - ctmux_ssh_host_keys:/etc/ssh/host_keys
      - ctl_taskd_data:/var/lib/ctl-taskd
      - ctl_data:/home/ctmux/.tokn/ctl
    restart: unless-stopped

volumes:
  ctmux_ssh_host_keys:
  ctl_taskd_data:
  ctl_data:
