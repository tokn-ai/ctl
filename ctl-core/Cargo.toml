[package]
name = "ctl-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Component identity, executable inspection, and storage paths shared by ctl and ctmux"
readme = "README.md"
categories = ["development-tools"]
keywords = ["ctl", "ctmux", "metadata", "storage"]
publish = ["crates-io"]

[dependencies]
dirs.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[features]
development = ["dep:sha2"]
observability = ["dep:time", "dep:rusqlite", "dep:serde_json", "dep:sha2", "dep:uuid", "uuid/serde", "dep:rustix"]
test-fixtures = ["dep:tokio", "dep:uuid"]
executable = ["dep:serde_json", "dep:sha2", "dep:tokio", "bundles"]
bundles = ["dep:serde_json", "dep:sha2", "dep:uuid", "dep:rustix"]

[build-dependencies]
sha2.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
uuid.workspace = true
sha2.workspace = true
serde_json.workspace = true

[lints]
workspace = true
