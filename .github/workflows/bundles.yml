name: Desktop, control daemon, and remote-agent bundles

on:
  workflow_dispatch:
    inputs:
      build_desktop:
        description: Build desktop packages (main/tag runs also update the draft release)
        required: true
        default: true
        type: boolean
      build_ctld:
        description: Build signed and notarized standalone macOS ctld packages (requires Apple signing credentials)
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  metadata:
    name: Bundle metadata
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      bundle_id: ${{ steps.metadata.outputs.bundle_id }}
      git_revision: ${{ steps.metadata.outputs.git_revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve immutable bundle identity
        id: metadata
        shell: bash
        run: |
          app_version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' apps/desktop/src-tauri/tauri.conf.json)
          if [[ -z "$app_version" ]]; then
            echo "could not read the app version" >&2
            exit 1
          fi
          cargo_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$app_version" != "$cargo_version" ]]; then
            echo "desktop version $app_version does not match Cargo release version $cargo_version" >&2
            exit 1
          fi
          frontend_version=$(python3 -c 'import json; print(json.load(open("apps/desktop/package.json"))["version"])')
          if [[ "$app_version" != "$frontend_version" ]]; then
            echo "desktop app version $app_version does not match frontend package version $frontend_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$app_version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match app version $app_version" >&2
              exit 1
            fi
            bundle_id=$app_version
          else
            bundle_id="$app_version-dev.${GITHUB_SHA:0:12}"
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          echo "git_revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  remote-agent:
    name: Remote agent (${{ matrix.target }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: agent-${{ matrix.target }}

      - name: Build remote components
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          -p ctl-agent -p ctmuxd -p ctl-taskd -p ctld

      - name: Package remote components
        shell: bash
        run: >-
          ./scripts/ci/package-agent-bundle.sh
          "${{ matrix.target }}"
          "${{ needs.metadata.outputs.app_version }}"
          "${{ needs.metadata.outputs.bundle_id }}"
          "${{ needs.metadata.outputs.git_revision }}"
          target/agent-bundles

      - name: Upload remote-agent bundle
        uses: actions/upload-artifact@v4
        with:
          name: ctl-agent-bundle-${{ matrix.target }}
          path: target/agent-bundles/*
          if-no-files-found: error
          retention-days: 30

  remote-agent-set:
    name: Remote agent bundle set
    needs:
      - metadata
      - remote-agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download remote-agent bundles
        uses: actions/download-artifact@v5
        with:
          pattern: ctl-agent-bundle-*
          path: target/agent-components
          merge-multiple: true

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate and assemble bundle set
        run: >-
          ./scripts/ci/assemble-agent-bundle-set.sh
          "${{ needs.metadata.outputs.app_version }}"
          "${{ needs.metadata.outputs.bundle_id }}"
          "${{ needs.metadata.outputs.git_revision }}"
          target/agent-components
          target/agent-bundle-set

      - name: Upload remote-agent bundle set
        uses: actions/upload-artifact@v4
        with:
          name: ctl-agent-bundle-set
          path: target/agent-bundle-set/*
          if-no-files-found: error
          retention-days: 30

  ctld:
    name: Signed standalone ctld (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_ctld)
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require Apple distribution signing configuration
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          NOTARY_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          NOTARY_KEY_ID: ${{ vars.APPLE_API_KEY }}
          PROFILE_BASE64: ${{ secrets.APPLE_CTLD_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          missing=()
          [[ -n "$CERTIFICATE_BASE64" ]] || missing+=(APPLE_CERTIFICATE)
          [[ -n "$CERTIFICATE_PASSWORD" ]] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -n "$NOTARY_ISSUER" ]] || missing+=(APPLE_API_ISSUER)
          [[ -n "$NOTARY_KEY_CONTENT" ]] || missing+=(APPLE_API_KEY_CONTENT)
          [[ -n "$NOTARY_KEY_ID" ]] || missing+=(APPLE_API_KEY)
          [[ -n "$PROFILE_BASE64" ]] || missing+=(APPLE_CTLD_PROVISIONING_PROFILE)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Standalone ctld releases require Apple distribution signing; missing: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare Apple signing assets
        env:
          APPLE_API_ISSUER_VALUE: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_VALUE: ${{ vars.APPLE_API_KEY }}
          PROFILE_BASE64: ${{ secrets.APPLE_CTLD_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          profile="$RUNNER_TEMP/ctld.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode -o "$profile"
          notary_key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_VALUE.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$notary_key"
          chmod 600 "$notary_key"
          echo "CTLD_PROVISIONING_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "CTLD_REQUIRE_DISTRIBUTION_SIGNING=true" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$notary_key" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ctld-${{ matrix.target }}

      - name: Build and sign standalone ctld
        env:
          CTLD_SIGNING_IDENTITY_OUTPUT: ${{ runner.temp }}/ctld-signing-identity
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" -p ctld
          ./scripts/ci/package-ctld-app.sh \
            "target/${{ matrix.target }}/release/ctld" \
            target/ctld-app/ctld.app \
            "${{ needs.metadata.outputs.app_version }}"

      - name: Notarize and package standalone ctld
        run: >-
          node scripts/ci/package-ctld-bundle.mts
          "${{ matrix.target }}"
          "${{ needs.metadata.outputs.app_version }}"
          "${{ needs.metadata.outputs.bundle_id }}"
          "${{ needs.metadata.outputs.git_revision }}"
          target/ctld-app/ctld.app
          target/ctld-assets

      - name: Upload standalone ctld assets
        uses: actions/upload-artifact@v4
        with:
          name: ctld-standalone-${{ matrix.target }}
          path: target/ctld-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Build ctl with the signed helper embedded
        if: needs.metadata.outputs.bundle_id == needs.metadata.outputs.app_version
        env:
          CTLD_SIGNING_IDENTITY_OUTPUT: ${{ runner.temp }}/ctld-signing-identity
        run: >-
          node scripts/ci/build-ctl-bundle.mts
          "${{ matrix.target }}"
          "${{ needs.metadata.outputs.app_version }}"
          "${{ needs.metadata.outputs.git_revision }}"
          target/ctl-cli-assets
          target/ctld-assets

      - name: Upload bundled ctl CLI
        if: needs.metadata.outputs.bundle_id == needs.metadata.outputs.app_version
        uses: actions/upload-artifact@v4
        with:
          name: ctl-cli-${{ matrix.target }}
          path: target/ctl-cli-assets/*
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Desktop (${{ matrix.target }})
    if: github.event_name == 'push' || inputs.build_desktop
    needs:
      - metadata
      - remote-agent-set
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle_config: bundle.linux.conf.json
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle_config: bundle.linux.conf.json
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundle_config: bundle.macos.conf.json
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundle_config: bundle.macos.conf.json
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download remote-agent bundles
        uses: actions/download-artifact@v5
        with:
          name: ctl-agent-bundle-set
          path: apps/desktop/src-tauri/resources/agent-bundles

      - name: Detect Apple signing configuration
        id: signing
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          NOTARY_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          NOTARY_KEY_ID: ${{ vars.APPLE_API_KEY }}
          PROFILE_BASE64: ${{ secrets.APPLE_CTLD_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          missing=()
          [[ -n "$CERTIFICATE_BASE64" ]] || missing+=(APPLE_CERTIFICATE)
          [[ -n "$CERTIFICATE_PASSWORD" ]] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -n "$NOTARY_ISSUER" ]] || missing+=(APPLE_API_ISSUER)
          [[ -n "$NOTARY_KEY_CONTENT" ]] || missing+=(APPLE_API_KEY_CONTENT)
          [[ -n "$NOTARY_KEY_ID" ]] || missing+=(APPLE_API_KEY)
          [[ -n "$PROFILE_BASE64" ]] || missing+=(APPLE_CTLD_PROVISIONING_PROFILE)
          if (( ${#missing[@]} > 0 )); then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              printf '::error::Version-tag macOS releases require Apple signing configuration: %s\n' "${missing[*]}"
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            printf '::notice::Building unsigned macOS packages; missing Apple signing configuration: %s\n' "${missing[*]}"
            echo 'macOS packages are unsigned and not notarized. Touch ID-protected credential storage requires a signed build.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare Apple signing assets
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_ISSUER_VALUE: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_VALUE: ${{ vars.APPLE_API_KEY }}
          PROFILE_BASE64: ${{ secrets.APPLE_CTLD_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          profile="$RUNNER_TEMP/ctld.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode -o "$profile"
          notary_key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_VALUE.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$notary_key"
          chmod 600 "$notary_key"
          echo "CTLD_PROVISIONING_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$notary_key" >> "$GITHUB_ENV"

      - name: Build and stage native daemons
        env:
          CTLD_SIGNING_IDENTITY_OUTPUT: ${{ runner.temp }}/ctld-signing-identity
          APPLE_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          CTLD_REQUIRE_DISTRIBUTION_SIGNING: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" -p ctld -p ctmuxd -p ctl-taskd
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/ctmuxd" \
            "apps/desktop/src-tauri/binaries/ctmuxd-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/ctl-taskd" \
            "apps/desktop/src-tauri/binaries/ctl-taskd-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == macOS ]]; then
            ./scripts/ci/package-ctld-app.sh \
              "target/${{ matrix.target }}/release/ctld" \
              target/ctld-app/ctld.app \
              "${{ needs.metadata.outputs.app_version }}"
            if [[ "$APPLE_SIGNING_ENABLED" == true ]]; then
              echo "APPLE_SIGNING_IDENTITY=$(<"$CTLD_SIGNING_IDENTITY_OUTPUT")" \
                >> "$GITHUB_ENV"
            fi
          else
            cp "target/${{ matrix.target }}/release/ctld" \
              "apps/desktop/src-tauri/binaries/ctld-${{ matrix.target }}"
          fi

      - name: Build desktop bundles
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        shell: bash
        run: |
          signing_args=()
          if [[ "$RUNNER_OS" == macOS && "$APPLE_SIGNING_ENABLED" != true ]]; then
            signing_args+=(--no-sign)
          fi
          pnpm --workspace-root desktop:build --target "${{ matrix.target }}" \
            --config src-tauri/tauri.bundle.conf.json \
            --config "src-tauri/${{ matrix.bundle_config }}" \
            "${signing_args[@]}"

      - name: Verify macOS bundle contents
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/ctmux.app"
          test -x "$app/Contents/MacOS/ctmux-app"
          test -x "$app/Contents/MacOS/ctmuxd"
          test -x "$app/Contents/MacOS/ctl-taskd"
          test -x "$app/Contents/Helpers/ctld.app/Contents/MacOS/ctld"
          plutil -lint "$app/Contents/Helpers/ctld.app/Contents/Info.plist"
          test -f "$app/Contents/Resources/resources/agent-bundles/bundle-set.json"

      - name: Verify signed ctld bundle
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/ctmux.app"
          ctld="$app/Contents/Helpers/ctld.app"
          test -f "$ctld/Contents/embedded.provisionprofile"
          codesign --verify --strict --verbose=2 "$ctld"
          codesign --verify --deep --strict --verbose=2 "$app"
          security cms -D \
            -i "$ctld/Contents/embedded.provisionprofile" \
            -o "$RUNNER_TEMP/ctld-profile.plist"
          actual_identifier=$(
            codesign -d --entitlements :- "$ctld" \
              > "$RUNNER_TEMP/ctld-entitlements.plist" 2>/dev/null
            /usr/libexec/PlistBuddy -c \
              'Print :com.apple.application-identifier' \
              "$RUNNER_TEMP/ctld-entitlements.plist"
          )
          expected_identifier=$(
            /usr/libexec/PlistBuddy -c \
              'Print :Entitlements:com.apple.application-identifier' \
              "$RUNNER_TEMP/ctld-profile.plist"
          )
          if [[ "$actual_identifier" != "$expected_identifier" ]]; then
            echo "ctld entitlement is $actual_identifier, expected $expected_identifier" >&2
            exit 1
          fi

      - name: Stage desktop release assets
        env:
          APPLE_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        shell: bash
        run: |
          signing_mode=not_applicable
          if [[ "$RUNNER_OS" == macOS ]]; then
            signing_mode=unsigned
            if [[ "$APPLE_SIGNING_ENABLED" == true ]]; then
              signing_mode=signed
            fi
          fi
          node scripts/ci/package-desktop-bundle.mts \
            "${{ matrix.target }}" \
            "${{ needs.metadata.outputs.bundle_id }}" \
            "${{ needs.metadata.outputs.git_revision }}" \
            "$signing_mode" \
            "target/${{ matrix.target }}/release/bundle" \
            target/desktop-assets

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ctmux-desktop-${{ matrix.target }}
          path: target/desktop-assets/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Update draft release
    if: >-
      always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.metadata.result == 'success' && needs.remote-agent-set.result == 'success' &&
      needs.desktop.result == 'success' && (needs.ctld.result == 'success' || needs.ctld.result == 'skipped')
    needs:
      - metadata
      - remote-agent-set
      - desktop
      - ctld
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: draft-release-${{ needs.metadata.outputs.app_version }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download desktop assets
        uses: actions/download-artifact@v5
        with:
          pattern: ctmux-desktop-*
          path: target/release-assets
          merge-multiple: true

      - name: Download remote-agent bundle set
        uses: actions/download-artifact@v5
        with:
          name: ctl-agent-bundle-set
          path: target/release-assets

      - name: Download standalone ctld assets
        if: needs.ctld.result == 'success'
        uses: actions/download-artifact@v5
        with:
          pattern: ctld-standalone-*
          path: target/release-assets
          merge-multiple: true

      - name: Download bundled ctl CLI assets
        if: needs.ctld.result == 'success' && needs.metadata.outputs.bundle_id == needs.metadata.outputs.app_version
        uses: actions/download-artifact@v5
        with:
          pattern: ctl-cli-*
          path: target/release-assets
          merge-multiple: true

      - name: Create or refresh the version draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          node scripts/ci/update-draft-release.mts
          "${{ needs.metadata.outputs.app_version }}"
          "${{ needs.metadata.outputs.bundle_id }}"
          "${{ needs.metadata.outputs.git_revision }}"
          target/release-assets
