[package]
name = "ctmux-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line client and terminal UI for persistent ctmux sessions"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["ctmux", "terminal", "multiplexer"]
publish = ["crates-io"]

[lib]
name = "ctmux_cli"
path = "src/lib.rs"

[[bin]]
name = "ctmux"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
clap.workspace = true
ctmux-client.workspace = true
ctmux-ipc.workspace = true
ctmux-proto.workspace = true
thiserror.workspace = true
tokio.workspace = true

ctmux-tui.workspace = true

[dev-dependencies]
ctmuxd.workspace = true
uuid.workspace = true

[lints]
workspace = true
