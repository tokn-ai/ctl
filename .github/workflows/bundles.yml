name: Desktop and remote-agent bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  remote-agent:
    name: Remote agent (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: agent-${{ matrix.target }}

      - name: Build remote components
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          -p ctl-agent -p rmuxd -p taskd

      - name: Package remote components
        shell: bash
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' apps/rmux/src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi
          ./scripts/ci/package-agent-bundle.sh "${{ matrix.target }}" "$version" target/agent-bundles

      - name: Upload remote-agent bundle
        uses: actions/upload-artifact@v4
        with:
          name: ctl-agent-bundle-${{ matrix.target }}
          path: target/agent-bundles/*
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Desktop (${{ matrix.target }})
    needs: remote-agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/rmux/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/rmux
        run: pnpm install --frozen-lockfile

      - name: Download remote-agent bundles
        uses: actions/download-artifact@v5
        with:
          pattern: ctl-agent-bundle-*
          path: apps/rmux/src-tauri/resources/agent-bundles
          merge-multiple: true

      - name: Build and stage native daemons
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" -p rmuxd -p taskd
          mkdir -p apps/rmux/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/rmuxd" \
            "apps/rmux/src-tauri/binaries/rmuxd-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/taskd" \
            "apps/rmux/src-tauri/binaries/taskd-${{ matrix.target }}"

      - name: Build desktop bundles
        working-directory: apps/rmux
        run: >-
          pnpm tauri build --target ${{ matrix.target }}
          --config src-tauri/tauri.bundle.conf.json

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: rmux-desktop-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 30
