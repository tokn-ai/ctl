[package]
name = "ctmux-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local IPC and daemon lifecycle management for ctmux"
readme = "README.md"
categories = ["network-programming"]
keywords = ["ctmux", "ipc", "terminal"]
publish = ["crates-io"]

[dependencies]
ctl-component-info = { workspace = true, features = ["executable"] }
ctmux-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4.4", features = ["tokio"] }
widestring = "1.2.1"
dirs.workspace = true
uuid = { workspace = true, features = ["v5"] }
