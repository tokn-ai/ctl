name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  dev-launcher:
    name: Development launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test development and release scripts
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning --test scripts/dev/*.test.mts scripts/ci/*.test.mts

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

  cargo-packages:
    name: Cargo packages (Rust 1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Package and test published sources
        run: node --experimental-strip-types scripts/ci/verify-cargo-packages.mts

  windows-check:
    name: Windows tasks and terminals
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      # Typecheck test sources without linking or executing Windows tests.
      - name: Check portable crates and test sources
        run: >-
          cargo check --locked --target x86_64-pc-windows-msvc --all-targets
          -p ctl-core -p ctmux-proto -p ctmux-core -p ctmux-client -p ctl-task-proto
          -p ctl-client -p ctl-proto -p ctmux-ipc -p ctl-task-ipc -p ctl-task-store -p ctl-task-cli -p ctl-taskd -p ctl-cli -p ctl-agent -p ctmux-cli -p ctmuxd -p ctmux-tui

      - name: Test Windows tasks and protocol framing
        run: cargo test --locked -p ctl-core -p ctl-taskd -p ctl-task-ipc -p ctl-task-proto -p ctl-task-store -p ctl-task-cli -p ctl-cli -p ctl-client -p ctl-proto -p ctl-agent -p ctmux-proto -p ctmux-tui

      - name: Test Windows ConPTY sessions
        run: cargo test --locked -p ctmuxd --test windows_conpty

      - name: Build Windows executables
        run: cargo build --locked -p ctl-cli -p ctl-agent -p ctl-taskd -p ctmux-cli -p ctmuxd -p ctmux-tui

      - name: Exercise ctl task auto-start and commands
        run: ./scripts/ci/windows-tasks.ps1

      - name: Exercise Windows ctmux auto-start and local ctl routing
        run: ./scripts/ci/windows-ctmux.ps1

      - name: Test authenticated Windows SSH gateway and reconnect
        run: ./scripts/ci/windows-ssh.ps1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Check workspace command entry points
        run: |
          pnpm desktop:dev --help
          pnpm desktop:build --help
          pnpm ctld:build --help
          pnpm ctld:provision --help
          pnpm bundles:sync --help

      - name: Run frontend tests
        run: pnpm desktop:test

      - name: Build frontend
        run: pnpm --filter ctmux-app build
