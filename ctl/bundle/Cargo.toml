[package]
name = "ctl-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bundle verification and installation storage for ctl tools"
readme = "README.md"
categories = ["development-tools"]
keywords = ["ctl", "bundles", "installation"]
publish = ["crates-io"]

[dependencies]
ctl-core = { workspace = true, features = ["bundles"], optional = true }
semver = { version = "1.0", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
time = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[features]
default = []
build-metadata = ["dep:semver", "dep:serde", "dep:serde_json", "dep:time"]
install = ["build-metadata", "dep:ctl-core", "dep:hex", "dep:sha2", "dep:uuid", "dep:zip"]
pack = ["build-metadata", "dep:zip"]

[[bin]]
name = "ctl-pack-ctream"
required-features = ["pack"]

[lints]
workspace = true
