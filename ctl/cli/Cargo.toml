[package]
name = "ctl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for local and remote terminal sessions, tasks, SSH, and VPN connections"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["ctl", "ssh", "terminal", "tasks", "vpn"]
publish = ["crates-io"]

[[bin]]
name = "ctl"
path = "src/main.rs"

[dependencies]
time.workspace = true
ctl-core = { workspace = true, features = ["observability"] }
clap.workspace = true
cliclack = "0.5.6"
comfy-table.workspace = true
ctl-client.workspace = true
ctl-proto.workspace = true
ctl-ipc.workspace = true
dirs.workspace = true
serde.workspace = true
uuid.workspace = true
ctmux-cli.workspace = true
ctl-task-cli.workspace = true
ctl-task-client.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
url = "2.5.8"
zeroize.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
rusqlite.workspace = true
ctl-core = { workspace = true, features = ["test-fixtures"] }
ctl-task-proto.workspace = true
ctmux-ipc.workspace = true
ctmux-proto.workspace = true
portable-pty.workspace = true
unicode-width.workspace = true
flate2 = "1.1.9"
tar = { version = "0.4.46", default-features = false }

[build-dependencies]
ctl-core = { workspace = true, features = ["development"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
rpassword.workspace = true
rustix.workspace = true

[target.'cfg(unix)'.build-dependencies]
rustix.workspace = true

[target.'cfg(unix)'.dev-dependencies]
avt.workspace = true
ctmux-client.workspace = true
ctmuxd.workspace = true
filedescriptor = "0.8.3"
nix = { workspace = true, features = ["signal"] }
rustix = { workspace = true, features = ["termios"] }

[lints]
workspace = true
