[workspace]
members = [
  "ctl/cli",
  "ctl/core",
  "ctl/daemon",
  "ctl/proto",
  "rmux/client",
  "rmux/cli",
  "rmux/core",
  "rmux/daemon",
  "rmux/ipc",
  "rmux/proto",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
avt = "0.18.0"
base64 = "0.22.1"
ctl-core = { path = "ctl/core" }
ctl-proto = { path = "ctl/proto" }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
getrandom = "0.3.4"
nix = { version = "0.29.0", default-features = false, features = ["fs"] }
portable-pty = "0.9.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rmux-core = { path = "rmux/core" }
rmux-client = { path = "rmux/client" }
rmux-ipc = { path = "rmux/ipc" }
rmux-proto = { path = "rmux/proto" }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1.26.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
