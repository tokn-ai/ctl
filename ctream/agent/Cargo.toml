[package]
name = "ctream-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
test-fixtures = []

[dependencies]
ctream-client.workspace = true
ctream-driver.workspace = true
ctream-driver-codec.workspace = true
ctream-proto.workspace = true
dirs.workspace = true
interprocess = { version = "2.4.9", features = ["tokio"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile = "3.27.0"
uuid = { workspace = true, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Performance", "Win32_System_RemoteDesktop"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }
rustix = { workspace = true, features = ["time"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
ctream-driver-capture.workspace = true
ctream-driver-input.workspace = true
ctream-platform.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
ctream-driver-capture.workspace = true
ctream-driver-input.workspace = true
dispatch2 = "0.3.1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["event", "net"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.14.0"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[[example]]
name = "windows-session-check"
path = "examples/windows_session_check/main.rs"

[[example]]
name = "windows-window-check"
path = "examples/windows_window_check/main.rs"
