[package]
name = "ctream-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ctream-driver.workspace = true
ctream-proto.workspace = true

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
ctream-driver-capture.workspace = true
ctream-driver-input.workspace = true
ctream-platform.workspace = true
serde_json.workspace = true

[dev-dependencies]
ctream-client.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[[example]]
name = "windows-session-check"
path = "examples/windows_session_check/main.rs"

[[example]]
name = "windows-window-check"
path = "examples/windows_window_check/main.rs"
