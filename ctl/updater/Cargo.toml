[package]
name = "ctlup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Installation and update manager for ctl and ctmux"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["ctl", "ctmux", "updater"]
publish = ["crates-io"]

[dependencies]
clap.workspace = true
ctl-client = { workspace = true, features = ["cli"] }
ctl-core = { workspace = true, features = ["bundles"] }
ctl-ipc.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
ctl-core = { workspace = true, features = ["ctld-bundle-build"] }

[dev-dependencies]
ctl-core = { workspace = true, features = ["test-fixtures"] }

[target.'cfg(unix)'.dev-dependencies]
ctl-proto.workspace = true
ctl-task-proto.workspace = true
ctmux-ipc.workspace = true
ctmux-proto.workspace = true
flate2 = "1.1.9"
tar = { version = "0.4.46", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1.1.9"
libproc = "0.14.11"
tar = { version = "0.4.46", default-features = false }

[lints]
workspace = true
