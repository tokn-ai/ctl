[package]
name = "ctmux-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Graphical client for local and SSH-connected ctmux terminal sessions"
publish = false

[lib]
name = "ctmux_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
ctl-core = { workspace = true, features = ["development"] }
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
ctl-core.workspace = true
ctl-proto.workspace = true
ctl-task-client.workspace = true
ctl-task-proto.workspace = true
ctl-task-store.workspace = true
ctl-task-ipc.workspace = true
base64.workspace = true
ctl-client.workspace = true
ctl-files.workspace = true
ctl-ipc.workspace = true
dirs.workspace = true
glob.workspace = true
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-session", "job-object", "creation-flags", "kill-on-drop"] }
tempfile = "3.27.0"
ctmux-client.workspace = true
ctmux-ipc.workspace = true
ctmux-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
hex.workspace = true
sha2.workspace = true
tauri = { version = "2.12.7", features = [] }
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
ctl-core = { workspace = true, features = ["test-fixtures"] }
flate2 = "1.1.11"
tar = { version = "0.4.46", default-features = false }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent"] }

[lints]
workspace = true
