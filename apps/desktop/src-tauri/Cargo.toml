[package]
name = "ctmux-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Graphical client for local and SSH-connected ctmux terminal sessions"
publish = false

[lib]
name = "ctmux_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ctl-core.workspace = true
ctl-proto.workspace = true
ctl-task-client.workspace = true
ctl-task-proto.workspace = true
ctl-task-store.workspace = true
ctl-task-ipc.workspace = true
base64.workspace = true
ctl-client.workspace = true
ctl-ipc.workspace = true
dirs.workspace = true
glob.workspace = true
ctmux-client.workspace = true
ctmux-ipc.workspace = true
ctmux-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
sha2.workspace = true
tauri = { version = "2", features = [] }
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
flate2 = "1.1.9"
tar = { version = "0.4.46", default-features = false }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent"] }

[lints]
workspace = true
