[package]
name = "ctl-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client transports, SSH connections, and remote component management for ctl"
readme = "README.md"
categories = ["network-programming"]
keywords = ["ctl", "ssh", "client"]
publish = ["crates-io"]

[dependencies]
ctl-component-info.workspace = true
dirs.workspace = true
glob.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
ctl-proto.workspace = true
ctl-ipc.workspace = true
ctmux-ipc.workspace = true
ctl-task-client.workspace = true
ctl-task-ipc.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
flate2 = "1.1.9"
tar = { version = "0.4.46", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
ctl-component-info = { workspace = true, features = ["executable"] }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "system-proxy"] }
flate2 = "1.1.9"
tar = { version = "0.4.46", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
