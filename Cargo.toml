[workspace]
members = [
  "ctl-component-info",
  "ctmux-process-info",
  "ctl/cli",
  "ctl/client",
  "ctl/proto",
  "ctl/agent",
  "ctl/ipc",
  "ctl/daemon",
  "ctl/keychain-client",
  "ctmux/client",
  "ctmux/cli",
  "ctmux/core",
  "ctmux/daemon",
  "apps/desktop/src-tauri",
  "apps/tui",
  "ctmux/ipc",
  "ctmux/proto",
  "task/proto",
  "task/ipc",
  "task/daemon",
  "task/cli",
  "task/client",
  "task/store",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
ctl-component-info = { path = "ctl-component-info" }
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "8.0.1"
crossterm = "0.29.0"
avt = "0.18.0"
base64 = "0.22.1"
ctl-client = { path = "ctl/client" }
ctl-proto = { path = "ctl/proto" }
ctl-ipc = { path = "ctl/ipc" }
dirs = "6.0.0"
glob = "0.3.4"
nix = { version = "0.29.0", default-features = false, features = ["fs"] }
portable-pty = "0.9.0"
ctmux-process-info = { path = "ctmux-process-info" }
ctmux-core = { path = "ctmux/core" }
ctmuxd = { path = "ctmux/daemon" }
ctmux-client = { path = "ctmux/client" }
ctmux-cli = { path = "ctmux/cli" }
ctmux-ipc = { path = "ctmux/ipc" }
ctmux-proto = { path = "ctmux/proto" }
rpassword = "7.5.4"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
ctl-task-ipc = { path = "task/ipc" }
ctl-task-proto = { path = "task/proto" }
ctl-task-cli = { path = "task/cli" }
ctl-task-client = { path = "task/client" }
ctl-task-store = { path = "task/store" }
tokio = { version = "1.53.1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
unicode-width = "0.1.14"
uuid = { version = "1.26.0", features = ["v4"] }
zeroize = { version = "1.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
