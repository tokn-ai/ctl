[package]
name = "ctream-preview"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ab_glyph = "0.2"
ctl-bundle = { workspace = true, features = ["install"] }
ctl-core.workspace = true
ctream-client.workspace = true
ctream-proto.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "clipboard", "links", "wgpu_no_default_features", "x11", "wayland"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
# Enable native GPU backends when eframe's default features are disabled.
wgpu = { version = "30.0.2", default-features = false, features = ["metal", "vulkan", "dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
ctream-driver-capture.workspace = true
ctream-driver-input.workspace = true
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["block2", "NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSString"] }
