[package]
name = "ctl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for local and remote terminal sessions, tasks, SSH, and VPN connections"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["ctl", "ssh", "terminal", "tasks", "vpn"]
publish = ["crates-io"]

[[bin]]
name = "ctl"
path = "src/main.rs"

[dependencies]
ctl-core.workspace = true
clap.workspace = true
cliclack = "0.5.6"
comfy-table.workspace = true
ctl-client.workspace = true
ctl-ipc.workspace = true
dirs.workspace = true
serde.workspace = true
uuid.workspace = true
ctmux-cli.workspace = true
ctl-task-cli.workspace = true
ctl-task-client.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
url = "2.5.8"
zeroize.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
ctl-proto.workspace = true
ctmux-proto.workspace = true
portable-pty.workspace = true
unicode-width.workspace = true
sha2.workspace = true

[build-dependencies]
ctl-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
rpassword.workspace = true
rustix.workspace = true

[target.'cfg(unix)'.build-dependencies]
rustix.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["termios"] }

[lints]
workspace = true
