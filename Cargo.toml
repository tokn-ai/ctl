[workspace]
members = [
  "rmux/cli",
  "rmux/core",
  "rmux/daemon",
  "rmux/ipc",
  "rmux/proto",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
portable-pty = "0.9.0"
rmux-core = { path = "rmux/core" }
rmux-ipc = { path = "rmux/ipc" }
rmux-proto = { path = "rmux/proto" }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
uuid = { version = "1.26.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
