[workspace]
members = [
  "ctl/core",
  "ctl/cli",
  "ctl/client",
  "ctl/files",
  "ctl/proto",
  "ctl/agent",
  "ctl/ipc",
  "ctl/daemon",
  "ctl/keychain-client",
  "ctl/bundle",
  "ctl/updater",
  "ctmux/client",
  "ctmux/cli",
  "ctmux/core",
  "ctmux/avt",
  "ctmux/daemon",
  "apps/desktop/src-tauri",
  "apps/tui",
  "ctmux/ipc",
  "ctmux/process-info",
  "ctmux/proto",
  "ctream/proto",
  "ctream/client",
  "ctream/driver",
  "ctream/driver-capture",
  "ctream/driver-input",
  "ctream/driver-codec",
  "ctream/windows",
  "ctream/platform",
  "ctream/cli",
  "ctream/agent",
  "ctream/preview",
  "ctream/wayland-input",
  "task/proto",
  "task/ipc",
  "task/daemon",
  "task/cli",
  "task/client",
  "task/store",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.5"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/tokn-ai/ctl"

[workspace.dependencies]
ctream-proto = { path = "ctream/proto" }
ctream-client = { path = "ctream/client" }
ctream-driver = { path = "ctream/driver" }
ctream-driver-capture = { path = "ctream/driver-capture" }
ctream-driver-input = { path = "ctream/driver-input" }
ctream-driver-codec = { path = "ctream/driver-codec" }
ctream-windows = { path = "ctream/windows" }
ctream-platform = { path = "ctream/platform" }
ctl-core = { package = "tokn-ctl-core", path = "ctl/core", version = "=0.1.5" }
clap = { version = "4.6.9", features = ["derive"] }
comfy-table = "8.0.1"
crossterm = "0.29.0"
terminput = "0.5.16"
terminput-crossterm = "0.4.12"
avt = { package = "ctmux-avt", path = "ctmux/avt", version = "=0.1.5" }
base64 = "0.23.1"
ctl-client = { path = "ctl/client", version = "=0.1.5" }
ctl-bundle = { path = "ctl/bundle", version = "=0.1.5" }
ctl-files = { path = "ctl/files", version = "=0.1.5" }
ctl-proto = { path = "ctl/proto", version = "=0.1.5" }
ctl-keychain-client = { path = "ctl/keychain-client", version = "=0.1.5" }
ctl-ipc = { path = "ctl/ipc", version = "=0.1.5" }
dirs = "7.0.0"
glob = "0.3.4"
hex = "0.4.3"
mio = { version = "1.2.5", default-features = false }
nix = { version = "0.32.0", default-features = false, features = ["fs"] }
portable-pty = "0.9.0"
ctmux-process-info = { path = "ctmux/process-info", version = "=0.1.5" }
ctmux-core = { path = "ctmux/core", version = "=0.1.5" }
ctmuxd = { path = "ctmux/daemon", version = "=0.1.5" }
ctmux-client = { path = "ctmux/client", version = "=0.1.5" }
ctmux-cli = { path = "ctmux/cli", version = "=0.1.5" }
ctmux-ipc = { path = "ctmux/ipc", version = "=0.1.5" }
ctmux-tui = { path = "apps/tui", version = "=0.1.5" }
ctmux-proto = { path = "ctmux/proto", version = "=0.1.5" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rpassword = "7.5.5"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
thiserror = "2.0.21"
ctl-task-ipc = { path = "task/ipc", version = "=0.1.5" }
ctl-task-proto = { path = "task/proto", version = "=0.1.5" }
ctl-task-cli = { path = "task/cli", version = "=0.1.5" }
ctl-task-client = { path = "task/client", version = "=0.1.5" }
ctl-taskd = { path = "task/daemon", version = "=0.1.5" }
ctl-task-store = { path = "task/store", version = "=0.1.5" }
tokio = { version = "1.54.1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
unicode-width = "0.2.3"
uuid = { version = "1.29.3", features = ["v4"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = { version = "1.9.2", features = ["serde"] }

# Managed development binaries verify their installation before opening sockets.
[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
