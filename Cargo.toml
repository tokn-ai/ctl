[workspace]
members = [
  "ctl-core",
  "ctmux-process-info",
  "ctl/cli",
  "ctl/client",
  "ctl/proto",
  "ctl/agent",
  "ctl/ipc",
  "ctl/daemon",
  "ctl/keychain-client",
  "ctmux/client",
  "ctmux/cli",
  "ctmux/core",
  "ctmux/avt",
  "ctmux/daemon",
  "apps/desktop/src-tauri",
  "apps/tui",
  "ctmux/ipc",
  "ctmux/proto",
  "task/proto",
  "task/ipc",
  "task/daemon",
  "task/cli",
  "task/client",
  "task/store",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/tokn-ai/ctl"

[workspace.dependencies]
ctl-core = { path = "ctl-core", version = "=0.1.0" }
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "8.0.1"
crossterm = "0.29.0"
avt = { package = "ctmux-avt", path = "ctmux/avt", version = "=0.1.0" }
base64 = "0.22.1"
ctl-client = { path = "ctl/client", version = "=0.1.0" }
ctl-proto = { path = "ctl/proto", version = "=0.1.0" }
ctl-keychain-client = { path = "ctl/keychain-client", version = "=0.1.0" }
ctl-ipc = { path = "ctl/ipc", version = "=0.1.0" }
dirs = "6.0.0"
glob = "0.3.4"
nix = { version = "0.29.0", default-features = false, features = ["fs"] }
portable-pty = "0.9.0"
ctmux-process-info = { path = "ctmux-process-info", version = "=0.1.0" }
ctmux-core = { path = "ctmux/core", version = "=0.1.0" }
ctmuxd = { path = "ctmux/daemon", version = "=0.1.0" }
ctmux-client = { path = "ctmux/client", version = "=0.1.0" }
ctmux-cli = { path = "ctmux/cli", version = "=0.1.0" }
ctmux-ipc = { path = "ctmux/ipc", version = "=0.1.0" }
ctmux-tui = { path = "apps/tui", version = "=0.1.0" }
ctmux-proto = { path = "ctmux/proto", version = "=0.1.0" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rpassword = "7.5.4"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
thiserror = "2.0.20"
ctl-task-ipc = { path = "task/ipc", version = "=0.1.0" }
ctl-task-proto = { path = "task/proto", version = "=0.1.0" }
ctl-task-cli = { path = "task/cli", version = "=0.1.0" }
ctl-task-client = { path = "task/client", version = "=0.1.0" }
ctl-taskd = { path = "task/daemon", version = "=0.1.0" }
ctl-task-store = { path = "task/store", version = "=0.1.0" }
tokio = { version = "1.53.1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
unicode-width = "0.1.14"
uuid = { version = "1.26.0", features = ["v4"] }
zeroize = { version = "1.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
