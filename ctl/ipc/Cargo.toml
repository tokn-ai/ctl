[package]
name = "ctl-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local connection broker protocol and lifecycle management for ctld"
readme = "README.md"
categories = ["network-programming"]
keywords = ["ctl", "ipc", "ssh"]
publish = ["crates-io"]

[dependencies]
ctl-core.workspace = true
dirs.workspace = true
ctl-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["net", "stdio"] }

[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4.4", features = ["tokio"] }
widestring = "1.2.1"
uuid = { workspace = true, features = ["v5"] }

[lints]
workspace = true
