[package]
name = "ctmux-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Interactive terminal UI for persistent ctmux sessions and shared views"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["ctmux", "terminal", "tui", "multiplexer"]
publish = ["crates-io"]

[dependencies]
avt.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
ctmux-client.workspace = true
ctmux-core.workspace = true
ctmux-ipc.workspace = true
ctmux-proto.workspace = true
tokio.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
# The default mio reader in 0.29 loops on terminal EOF/fatal read errors.
# This backend propagates read errors and honors finite polling deadlines.
crossterm = { workspace = true, features = ["use-dev-tty"] }

[dev-dependencies]
portable-pty.workspace = true
ctmuxd.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dev-dependencies]
filedescriptor = "0.8.3"
nix = { workspace = true, features = ["signal"] }

[lints]
workspace = true
