[package]
name = "ctld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-user SSH connection and credential broker for ctl"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["ctl", "ssh", "daemon", "vpn"]
publish = ["crates-io"]

[dependencies]
ctl-core = { workspace = true, features = ["observability"] }
clap.workspace = true
base64.workspace = true
dirs.workspace = true
serde.workspace = true
rpassword.workspace = true
ctl-ipc.workspace = true
ctl-proto.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true
url = "2.5.8"
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ctl-keychain-client.workspace = true
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[lints]
workspace = true

[dev-dependencies]
ctl-core = { workspace = true, features = ["test-fixtures"] }
