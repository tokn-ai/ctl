[package]
name = "ctream-preview"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
# Enable native GPU backends when eframe's default features are disabled.
wgpu = { version = "27", default-features = false, features = ["metal", "vulkan", "dx12"] }
